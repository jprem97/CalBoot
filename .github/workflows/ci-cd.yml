# ============================================================
# GitHub Actions Workflow: Build and Deploy
# ============================================================
# This workflow automatically builds the Java application,
# packages it into a Docker image, pushes it to Docker Hub,
# and deploys it to an EC2 instance on every push to 'main'.
# ============================================================

# Workflow name displayed in the GitHub Actions UI
name: Build and Deploy

# ----------------------------------------------------------
# Trigger: Runs automatically when code is pushed to 'main'
# ----------------------------------------------------------
on:
  push:
    branches:
      - main

# ----------------------------------------------------------
# Environment variables used across all jobs
# IMAGE_NAME: Full Docker Hub image path (username/repo)
# ----------------------------------------------------------
env:
  IMAGE_NAME: your-dockerhub-username/my-java-app

# ----------------------------------------------------------
# Jobs: All steps run sequentially in a single job
# ----------------------------------------------------------
jobs:
  # --------------------------------------------------------
  # Job: deploy - Builds, pushes, and deploys the app
  # Runs on: Ubuntu latest (GitHub-hosted runner)
  # --------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------
      # Step 1: Checkout Code
      # Clones the repository into the runner workspace
      # so the workflow can access the source code
      # ----------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # Step 2: Set up JDK 21
      # Installs Java 21 (Temurin distribution) on the
      # runner so Maven can compile the project
      # ----------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ----------------------------------------------------
      # Step 3: Build Application
      # Compiles the Java app and packages it as a JAR/WAR
      # -DskipTests skips unit tests to speed up the build
      # ----------------------------------------------------
      - name: Build Application
        run: mvn clean package -DskipTests

      # ----------------------------------------------------
      # Step 4: Login to Docker Hub
      # Authenticates to Docker Hub using stored secrets
      # (DOCKER_USERNAME and DOCKER_PASSWORD)
      # ----------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ----------------------------------------------------
      # Step 5: Build Docker Image
      # Builds the Docker image from the Dockerfile in the
      # repo root. Tags it with 'latest' AND the commit SHA
      # for traceability (e.g., abc1234)
      # ----------------------------------------------------
      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:latest .
          docker tag $IMAGE_NAME:latest $IMAGE_NAME:${{ github.sha }}

      # ----------------------------------------------------
      # Step 6: Push Docker Images
      # Pushes both tags (latest + commit SHA) to Docker
      # Hub so the EC2 server can pull the image later
      # ----------------------------------------------------
      - name: Push Docker Images
        run: |
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}

      # ----------------------------------------------------
      # Step 7: Deploy to EC2
      # SSHs into the EC2 instance, pulls the latest image,
      # stops and removes the old container (if running),
      # and starts a new container on port 8080.
      # Finally prunes unused Docker images to free disk.
      # ----------------------------------------------------
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            # Pull the latest image from Docker Hub
            docker pull $IMAGE_NAME:latest

            # Stop the old container if it exists (ignore error if not found)
            docker stop my-java-app || true
            # Remove the old container if it exists
            docker rm my-java-app || true

            # Start a new detached container with port mapping
            docker run -d \
              --name my-java-app \
              -p 8080:8080 \
              --restart unless-stopped \
              $IMAGE_NAME:latest

            # Remove dangling images to keep disk clean
            docker image prune -f
